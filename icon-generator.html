<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Locker Icon Generator</title>
  <style>
    body { font-family: sans-serif; background: #1e1b4b; color: white; text-align: center; padding: 40px 16px; }
    canvas { border-radius: 24px; margin: 20px auto; display: block; border: 2px solid #fbbf24; }
    button { background: #fbbf24; color: #1e1b4b; border: none; padding: 14px 20px; font-weight: bold; border-radius: 12px; font-size: 15px; margin: 8px auto; width: 100%; max-width: 300px; display: block; }
  </style>
</head>
<body>
  <h2 style="margin: 0;">mis-org Icon Generator</h2>
  <p style="color: #cbd5e1; font-size: 13px;">Tap both buttons below to save the locker icons to your phone:</p>

  <canvas id="preview" width="160" height="160"></canvas>

  <button onclick="downloadIcon(192)">1. Download icon-192.png</button>
  <button onclick="downloadIcon(512)">2. Download icon-512.png</button>

  <script>
    function drawLocker(ctx, size) {
      // 1. Dark Indigo Background
      ctx.fillStyle = '#1e1b4b';
      ctx.fillRect(0, 0, size, size);

      // 2. Amber Locker Body
      const pad = size * 0.12;
      const w = size - (pad * 2);
      const h = size - (pad * 2);
      const r = size * 0.16;

      ctx.fillStyle = '#fbbf24';
      ctx.beginPath();
      ctx.roundRect(pad, pad, w, h, r);
      ctx.fill();

      // 3. Vault Frame
      ctx.fillStyle = '#1e1b4b';
      ctx.strokeStyle = '#1e1b4b';
      ctx.lineWidth = size * 0.038;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      const innerPad = size * 0.22;
      const innerW = size - (innerPad * 2);
      const innerH = size - (innerPad * 2);
      ctx.strokeRect(innerPad, innerPad, innerW, innerH);

      // Hinges
      const hingeW = size * 0.04;
      const hingeH = size * 0.085;
      ctx.fillRect(innerPad - (hingeW / 2), size * 0.33, hingeW, hingeH);
      ctx.fillRect(innerPad - (hingeW / 2), size * 0.59, hingeW, hingeH);

      // 4. Dial & Spokes
      const cx = size * 0.52;
      const cy = size * 0.50;
      const dialR = size * 0.145;

      ctx.beginPath();
      ctx.arc(cx, cy, dialR, 0, Math.PI * 2);
      ctx.stroke();

      for (let i = 0; i < 4; i++) {
        const angle = (i * Math.PI) / 2;
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(angle) * (dialR * 0.4), cy + Math.sin(angle) * (dialR * 0.4));
        ctx.lineTo(cx + Math.cos(angle) * (dialR * 1.35), cy + Math.sin(angle) * (dialR * 1.35));
        ctx.stroke();
      }

      ctx.beginPath();
      ctx.arc(cx, cy, dialR * 0.38, 0, Math.PI * 2);
      ctx.fill();
    }

    // Render preview
    drawLocker(document.getElementById('preview').getContext('2d'), 160);

    function downloadIcon(size) {
      const c = document.createElement('canvas');
      c.width = size;
      c.height = size;
      drawLocker(c.getContext('2d'), size);

      const a = document.createElement('a');
      a.download = 'icon-' + size + '.png';
      a.href = c.toDataURL('image/png');
      a.click();
    }
  </script>
</body>
</html>
