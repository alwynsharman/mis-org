<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mis-org Vault Icon Generator</title>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: white; text-align: center; padding: 24px 16px; margin: 0; }
    .preview-box { display: flex; justify-content: center; align-items: center; gap: 20px; margin: 20px 0; }
    .badge {
      width: 110px; height: 110px; background: #fbbf24; border-radius: 28px;
      display: flex; align-items: center; justify-content: center;
      color: #1e1b4b; font-size: 64px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    canvas { border-radius: 28px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .btn { background: #fbbf24; color: #1e1b4b; border: none; padding: 14px 20px; font-weight: 800; border-radius: 12px; font-size: 15px; margin: 8px auto; width: 100%; max-width: 320px; display: block; cursor: pointer; }
    .btn:active { transform: scale(0.97); }
    .status { font-size: 12px; color: #38bdf8; margin-bottom: 12px; }
  </style>
</head>
<body>
  <h2 style="margin: 0; font-size: 18px;">Official Vault Icon Generator</h2>
  <p style="color: #94a3b8; font-size: 12px; margin: 4px 0 16px;">1:1 Vector match with the in-app Phosphor vault logo</p>

  <div class="status" id="load-status">Loading official Phosphor vector asset...</div>

  <div class="preview-box">
    <div>
      <div style="font-size: 11px; color: #94a3b8; font-weight: bold; margin-bottom: 6px;">1. IN-APP BADGE</div>
      <div class="badge">
        <i class="ph ph-vault"></i>
      </div>
    </div>
    <div>
      <div style="font-size: 11px; color: #94a3b8; font-weight: bold; margin-bottom: 6px;">2. PWA ICON PREVIEW</div>
      <canvas id="preview" width="110" height="110"></canvas>
    </div>
  </div>

  <button class="btn" onclick="downloadIcon(192)">Download icon-192.png</button>
  <button class="btn" onclick="downloadIcon(512)">Download icon-512.png</button>

  <script>
    let vaultSvgText = null;

    async function fetchSvg() {
      const urls = [
        'https://cdn.jsdelivr.net/npm/@phosphor-icons/core@2.1.1/assets/regular/vault.svg',
        'https://unpkg.com/@phosphor-icons/core@2.1.1/assets/regular/vault.svg'
      ];
      for (const url of urls) {
        try {
          const res = await fetch(url);
          if (res.ok) {
            vaultSvgText = await res.text();
            document.getElementById('load-status').innerText = '✓ Official Phosphor vector loaded successfully';
            document.getElementById('load-status').style.color = '#4ade80';
            drawToCanvas(document.getElementById('preview'), 110);
            return;
          }
        } catch (e) {}
      }
      document.getElementById('load-status').innerText = 'Failed to load remote vector asset.';
      document.getElementById('load-status').style.color = '#f87171';
    }

    function drawToCanvas(canvas, size, callback) {
      if (!vaultSvgText) return;
      const ctx = canvas.getContext('2d');
      canvas.width = size;
      canvas.height = size;

      // 1. Amber Background matching app badge
      ctx.fillStyle = '#fbbf24';
      ctx.fillRect(0, 0, size, size);

      // 2. Format SVG with exact dark indigo fill
      const coloredSvg = vaultSvgText.replace(/fill="currentColor"/g, 'fill="#1e1b4b"');
      const blob = new Blob([coloredSvg], { type: 'image/svg+xml;charset=utf-8' });
      const blobUrl = URL.createObjectURL(blob);
      const img = new Image();

      img.onload = () => {
        // Safe-zone padding for Android launcher icons
        const pad = size * 0.16;
        const iconSize = size - (pad * 2);
        ctx.drawImage(img, pad, pad, iconSize, iconSize);
        URL.revokeObjectURL(blobUrl);
        if (callback) callback();
      };
      img.src = blobUrl;
    }

    function downloadIcon(size) {
      const c = document.createElement('canvas');
      drawToCanvas(c, size, () => {
        const a = document.createElement('a');
        a.download = `icon-${size}.png`;
        a.href = c.toDataURL('image/png');
        a.click();
      });
    }

    fetchSvg();
  </script>
</body>
</html>
